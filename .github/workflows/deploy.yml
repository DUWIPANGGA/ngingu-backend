name: CI & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI (Lint & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-

      - name: Copy env
        run: |
          cp .env.example .env
          sed -i 's/^BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=null/' .env

      - name: Install Composer dependencies
        run: |
          BROADCAST_CONNECTION=null \
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: vendor/bin/phpunit


  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass & rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Sync files to server
        run: |
          export SSHPASS="${{ secrets.SERVER_PASSWORD }}"

          sshpass -e rsync \
            -e "ssh -p ${{ secrets.SERVER_PORT || '22' }} -o StrictHostKeyChecking=no" \
            -avz --delete --progress \
            --exclude '.env' \
            --exclude '.env.production' \
            --exclude '.git' \
            --exclude '.secret' \
            --exclude '.secret_deploy' \
            --exclude 'node_modules' \
            --exclude 'vendor' \
            --exclude 'storage/app/public' \
            --exclude 'storage/logs' \
            --exclude 'storage/framework/cache' \
            --exclude 'storage/framework/sessions' \
            --exclude 'storage/framework/views' \
            --exclude 'public/build' \
            --exclude 'docker/data' \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/ngingu/


      - name: Build & restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}

          script: |
            set -e

            cd /var/www/ngingu

            echo "=========================================="
            echo "BUILD & RESTART NGINU"
            echo "=========================================="

            sudo docker compose up -d --build --force-recreate

            echo "==> Waiting for container..."
            sleep 15

            echo "=========================================="
            echo "CONTAINER STATUS"
            echo "=========================================="

            sudo docker ps \
              --filter name=ngingu-be \
              --format "{{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "=========================================="
            echo "CONTAINER HEALTH"
            echo "=========================================="

            STATUS=$(sudo docker inspect \
              --format='{{.State.Status}}' \
              ngingu-be)

            echo "Status: $STATUS"

            if [ "$STATUS" != "running" ]; then
              echo "ERROR: ngingu-be is not running!"
              echo "--- recent logs ---"
              sudo docker logs ngingu-be --tail 100
              exit 1
            fi

            echo "=========================================="
            echo "DATABASE MIGRATION"
            echo "=========================================="

            sudo docker exec ngingu-be \
              php artisan migrate --force

            echo "=========================================="
            echo "LARAVEL CACHE"
            echo "=========================================="

            sudo docker exec ngingu-be \
              php artisan optimize:clear

            sudo docker exec ngingu-be \
              php artisan config:cache

            sudo docker exec ngingu-be \
              php artisan route:cache

            sudo docker exec ngingu-be \
              php artisan view:cache

            echo "=========================================="
            echo "HEALTH CHECK"
            echo "=========================================="

            curl -s -o /dev/null \
              -w "HTTP %{http_code}\n" \
              http://127.0.0.1:8010

            echo "=========================================="
            echo "RECENT LOGS"
            echo "=========================================="

            sudo docker logs ngingu-be --tail 30

            echo "=========================================="
            echo "DEPLOY SUCCESS"
            echo "=========================================="