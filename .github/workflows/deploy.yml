name: CI & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI (Lint & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-

      - name: Copy env
        run: |
          cp .env.example .env
          sed -i 's/^BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=null/' .env
          # .env.example pakai FILESYSTEM_DISK=s3 tapi driver S3 tidak dipasang
          # di CI — pakai disk lokal supaya test Storage (ScanTest) tidak 500.
          sed -i 's/^FILESYSTEM_DISK=.*/FILESYSTEM_DISK=public/' .env
          sed -i 's/^UPLOAD_DISK=.*/UPLOAD_DISK=public/' .env

      - name: Install Composer dependencies
        run: |
          BROADCAST_CONNECTION=null \
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: vendor/bin/phpunit


  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hash tiap file seeder → dibandingkan dengan marker di server
      # (storage/framework/seeders.md5). Seeder yang berubah saja yang dijalankan.
      # Dikecualikan:
      #  - DatabaseSeeder.php: hanya pemanggil; menjalankannya = semua seeder.
      #  - UserSeeder.php: akun demo, tidak boleh pernah dibuat di production.
      - name: Hash seeders
        id: seeder
        run: |
          list=""
          for f in database/seeders/*.php; do
            name=$(basename "$f")
            case "$name" in
              DatabaseSeeder.php|UserSeeder.php) continue ;;
            esac
            list="${list}$(md5sum "$f" | cut -d' ' -f1):${name};"
          done
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "seeder terdeteksi: $list"

      - name: Install sshpass & rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Sync files to server
        run: |
          export SSHPASS="${{ secrets.SERVER_PASSWORD }}"

          sshpass -e rsync \
            -e "ssh -p ${{ secrets.SERVER_PORT || '22' }} -o StrictHostKeyChecking=no" \
            -avz --delete --progress \
            --exclude '.env' \
            --exclude '.env.production' \
            --exclude '.git' \
            --exclude '.secret' \
            --exclude '.secret_deploy' \
            --exclude 'node_modules' \
            --exclude 'vendor' \
            --exclude '/storage' \
            --exclude 'public/build' \
            --exclude 'docker/data' \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/ngingu/


      - name: Build & restart container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}

          script: |
            set -e

            cd /var/www/ngingu

            echo "=========================================="
            echo "STORAGE PERMISSION"
            echo "=========================================="

            # rsync menyalin permission dari repo (755) sehingga www-data tidak
            # bisa menulis storage (upload foto scan gagal 500). Set ulang:
            # owner = user deploy (untuk rsync), group = www-data (untuk PHP-FPM).
            DEPLOY_UID=$(id -u)
            WWW_GID=$(sudo docker exec ngingu-be id -g www-data)
            echo "owner=$DEPLOY_UID group=$WWW_GID"

            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S chown -R "$DEPLOY_UID:$WWW_GID" storage
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S find storage -type d -exec chmod 775 {} +
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S find storage -type f -exec chmod 664 {} +

            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S docker compose up -d --build --force-recreate

            echo "=========================================="
            echo "BUILD & RESTART NGINU"
            echo "=========================================="

            echo "==> Waiting for container..."
            sleep 15

            echo "=========================================="
            echo "CONTAINER STATUS"
            echo "=========================================="

            sudo docker ps \
              --filter name=ngingu-be \
              --format "{{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "=========================================="
            echo "CONTAINER HEALTH"
            echo "=========================================="

            STATUS=$(sudo docker inspect \
              --format='{{.State.Status}}' \
              ngingu-be)

            echo "Status: $STATUS"

            if [ "$STATUS" != "running" ]; then
              echo "ERROR: ngingu-be is not running!"
              echo "--- recent logs ---"
              sudo docker logs ngingu-be --tail 100
              exit 1
            fi

            echo "=========================================="
            echo "DATABASE MIGRATION"
            echo "=========================================="

            sudo docker exec ngingu-be \
              php artisan migrate --force

            echo "=========================================="
            echo "SEEDER OTOMATIS (hanya yang berubah)"
            echo "=========================================="

            # FR-09.2.1 — data penyakit (11 kelas model) & data bantuan harus
            # ikut ter-deploy tiap kali file seeder di repo berubah. Marker
            # disimpan di storage (tidak ikut rsync) agar deploy berikutnya
            # tahu seeder mana yang sudah dijalankan.
            SEED_LIST='${{ steps.seeder.outputs.list }}'
            SEED_MARKER=storage/framework/seeders.md5
            SEED_TMP="${SEED_MARKER}.tmp"
            PREV="$(cat "$SEED_MARKER" 2>/dev/null || true)"
            : > "$SEED_TMP"

            printf '%s' "$SEED_LIST" | tr ';' '\n' | while IFS= read -r item; do
              [ -z "$item" ] && continue
              hash="${item%%:*}"
              name="${item##*:}"
              printf '%s=%s\n' "$name" "$hash" >> "$SEED_TMP"
              old="$(printf '%s\n' "$PREV" | grep -F "${name}=" | cut -d= -f2 || true)"
              if [ "$old" != "$hash" ]; then
                echo "berubah: $name"
                sudo docker exec ngingu-be php artisan db:seed \
                  --class="Database\\Seeders\\${name%.php}" --force
              else
                echo "tetap  : $name"
              fi
            done

            mv -f "$SEED_TMP" "$SEED_MARKER"

            echo "=========================================="
            echo "LARAVEL CACHE"
            echo "=========================================="

            sudo docker exec ngingu-be \
              php artisan optimize:clear

            sudo docker exec ngingu-be \
              php artisan config:cache

            sudo docker exec ngingu-be \
              php artisan route:cache

            sudo docker exec ngingu-be \
              php artisan view:cache

            echo "=========================================="
            echo "HEALTH CHECK"
            echo "=========================================="

            curl -s -o /dev/null \
              -w "HTTP %{http_code}\n" \
              http://127.0.0.1:8010

            echo "=========================================="
            echo "RECENT LOGSS"
            echo "=========================================="

            sudo docker logs ngingu-be --tail 30

            echo "=========================================="
            echo "DEPLOY SUCCESS"
            echo "=========================================="